[package]
name = "artcraft-apps-manager"
version = "0.4.0"
edition = "2021"
description = "Install, update and manage the ArtCraft desktop apps published at github.com/storytold"
license = "MIT"
publish = false

[dependencies]
eframe = "0.31"
tray-icon = "0.21"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
winreg = "0.55"
notify-rust = "4"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
